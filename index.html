<script>
  // JS tương tác rõ ràng cho js.org
  document.addEventListener('DOMContentLoaded', () => {
    // Alert chào mừng
    alert('Chào mừng đến trang lớp 9A7 K57 - Powered by JavaScript trên GitHub Pages! 🌟');

    // Thay đổi tiêu đề khi click
    const title = document.querySelector('h1');
    if (title) {
      title.addEventListener('click', () => {
        title.textContent = title.textContent === 'Xin chào từ GitHub Pages!' 
          ? 'Bạn vừa click bằng JS nè! 😎' 
          : 'Xin chào từ GitHub Pages!';
      });
    }

    // Slideshow ảnh đơn giản (nếu có nhiều ảnh)
    const images = document.querySelectorAll('img');
    let current = 0;
    setInterval(() => {
      if (images.length > 1) {
        images[current].style.opacity = 0.5;
        current = (current + 1) % images.length;
        images[current].style.opacity = 1;
      }
    }, 3000);
  });
</script>
